name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: "for f in $(find . -name \"*.rb\" -o -name \"*.gemspec\"); do ruby -c \"$f\" >/dev/null || exit 1; done"
